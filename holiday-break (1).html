<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Happy Holidays from Springboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#0455F6; --blue75:#DEEBFF; --purple:#7E43D0; --purple50:#F0E6FF;
    --leaf:#C3F570; --leaf100:#DCFBDA; --leaf50:#F4FDEC; --navy:#0B2540; --gray:#D7D7DC;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{padding:8px}
  body{font-family:"Manrope","Inter",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--navy);background:transparent;-webkit-font-smoothing:antialiased}
  button{font:inherit;cursor:pointer;border:0}
  button:focus-visible{outline:3px solid var(--leaf);outline-offset:4px}

  .stage{position:relative;height:min(640px,calc(100vh - 16px));min-height:440px;border-radius:28px;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:28px}
  .thanksgiving .stage{background:linear-gradient(160deg,var(--leaf50) 0%,var(--blue75) 60%,var(--purple50) 100%)}
  .christmas .stage{background:linear-gradient(160deg,#2E6FF8 0%,var(--blue) 45%,#3D3FD9 80%,var(--purple) 130%)}
  canvas.fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}

  /* ---------- the gift ---------- */
  .gift-wrap{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:22px;transition:opacity .5s,transform .5s}
  .gift-wrap.gone{opacity:0;transform:translateY(30px) scale(.9);pointer-events:none}
  .gift{position:relative;width:200px;height:190px;background:none;padding:0;animation:wiggle 3.2s ease-in-out infinite}
  .gift:hover{animation-duration:1.4s}
  @keyframes wiggle{0%,70%,100%{transform:rotate(0)}76%{transform:rotate(-5deg)}82%{transform:rotate(5deg)}88%{transform:rotate(-3deg)}94%{transform:rotate(2deg)}}
  .box{position:absolute;left:14px;right:14px;bottom:0;height:120px;border-radius:14px}
  .lid{position:absolute;left:0;right:0;top:34px;height:42px;border-radius:12px;transform-origin:20% 100%;transition:transform .7s cubic-bezier(.3,1.4,.5,1)}
  .ribbon-v{position:absolute;left:50%;width:30px;margin-left:-15px;top:0;bottom:0;border-radius:4px}
  .bow{position:absolute;top:-30px;left:50%;width:100px;height:40px;margin-left:-50px}
  .bow i{position:absolute;top:4px;width:46px;height:34px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%}
  .bow i:first-child{left:0;transform:rotate(-18deg)}
  .bow i:last-child{right:0;transform:rotate(18deg)}
  .bow b{position:absolute;left:50%;top:12px;width:20px;height:20px;margin-left:-10px;border-radius:6px}
  .thanksgiving .box{background:linear-gradient(135deg,#9A63E0,var(--purple))}
  .thanksgiving .lid{background:linear-gradient(135deg,#A774E6,#6B35BC)}
  .christmas .box{background:linear-gradient(135deg,#FFFFFF,var(--blue75))}
  .christmas .lid{background:linear-gradient(135deg,#FFFFFF,#CFE0FF)}
  .ribbon-v,.bow i,.bow b{background:var(--leaf)}
  .bow b{background:#A9E04F}
  .gift.open{animation:none}
  .gift.open .lid{transform:translate(-40px,-120px) rotate(-38deg)}
  .hint{font-weight:800;font-size:18px;padding:10px 20px;border-radius:999px}
  .thanksgiving .hint{background:#fff;color:var(--purple)}
  .christmas .hint{background:rgba(255,255,255,.16);color:#fff}

  /* ---------- the gift inside: message + wallpaper ---------- */
  .note{position:absolute;z-index:3;width:min(760px,calc(100% - 40px));max-height:calc(100% - 40px);overflow:auto;border-radius:26px;padding:26px 28px;display:grid;grid-template-columns:auto 1fr;gap:26px;align-items:center;background:linear-gradient(150deg,rgba(255,255,255,.97),rgba(255,255,255,.88));box-shadow:0 30px 60px -28px rgba(11,37,64,.45);opacity:0;transform:translateY(40px) scale(.94);pointer-events:none;transition:opacity .6s .35s,transform .7s .35s cubic-bezier(.2,1.2,.4,1)}
  .note.show{opacity:1;transform:none;pointer-events:auto}
  .phone{width:170px;aspect-ratio:9/19.5;border-radius:26px;padding:7px;background:var(--navy);box-shadow:0 18px 34px -18px rgba(11,37,64,.7);transform:rotate(-4deg)}
  .phone img{display:block;width:100%;height:100%;border-radius:20px;object-fit:cover}
  .copy{min-width:0}
  .emoji{font-size:30px;line-height:1;margin-bottom:8px;letter-spacing:4px}
  .note h1{margin:0 0 10px;font-size:clamp(26px,4vw,34px);font-weight:800;letter-spacing:-.02em;line-height:1.1}
  .thanksgiving .note h1{color:var(--purple)}
  .christmas .note h1{color:var(--blue)}
  .note p{margin:0 0 10px;max-width:44ch;font-size:16px;line-height:1.55;font-weight:500}
  .gift-line{font-weight:800!important;font-size:15px!important;color:var(--navy);margin-top:14px!important}
  .dl{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 14px}
  .dl button{height:44px;padding:0 18px;border-radius:999px;font-weight:800;font-size:15px;color:#fff;background:linear-gradient(135deg,#3A78FA,var(--blue) 60%,#3D3FD9)}
  .dl button.alt{background:var(--leaf);color:var(--navy)}
  .breaknote{display:flex;gap:10px;align-items:flex-start;margin:4px 0 6px;padding:10px 14px;border-radius:16px;background:var(--leaf50);box-shadow:inset 0 0 0 1px var(--leaf100);font-weight:700;font-size:14.5px;line-height:1.45;text-align:left;max-width:46ch}
  .breaknote[hidden]{display:none}
  .sign{font-weight:700;font-size:14px!important;opacity:.8}
  .again{height:38px;padding:0 16px;border-radius:999px;font-weight:800;font-size:14px;background:var(--blue75);color:var(--blue)}
  .foot{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  @media (max-width:620px){
    .note{grid-template-columns:1fr;justify-items:center;text-align:center;padding:22px 18px;gap:16px}
    .phone{width:96px}
    .emoji{display:none}
    .note p{font-size:15px}
    .dl,.foot{justify-content:center}
    .gift{transform:scale(.85)}
  }
  @media (prefers-reduced-motion:reduce){
    .gift{animation:none}
    *{transition-duration:.01ms!important}
  }
</style>
</head>
<body>
<main class="stage" id="stage">
  <canvas class="fx" id="fx" aria-hidden="true"></canvas>

  <div class="gift-wrap" id="giftWrap">
    <button class="gift" id="gift" aria-label="Open your gift">
      <span class="box"><span class="ribbon-v"></span></span>
      <span class="lid"><span class="ribbon-v"></span><span class="bow"><i></i><i></i><b></b></span></span>
    </button>
    <span class="hint" id="hint">Tap to open your gift</span>
  </div>

  <section class="note" id="note" aria-live="polite">
    <div class="phone"><img id="preview" alt="Holiday phone wallpaper preview"></div>
    <div class="copy">
      <div class="emoji" id="noteEmoji"></div>
      <h1 id="noteTitle"></h1>
      <p id="noteBody"></p>
      <div class="breaknote" id="noteBreak"><span aria-hidden="true">🗓️</span><span id="noteBreakText"></span></div>
      <p class="gift-line">Your gift: a holiday wallpaper 🎁</p>
      <div class="dl">
        <button id="dlPhone">Download for phone</button>
        <button class="alt" id="dlLaptop">Download for laptop</button>
      </div>
      <div class="foot"><p class="sign" id="noteSign" style="margin:0"></p><button class="again" id="again">↺ Open it again</button></div>
    </div>
  </section>
</main>

<script>
/* =========================================================
   EDIT HERE — message text and return dates (DRAFT copy)
   Pick the theme in the Canvas link: ?theme=thanksgiving or ?theme=christmas
   Leave a returnDate empty ("") to hide that line.
   ========================================================= */
const MESSAGES = {
  thanksgiving: {
    emoji: "🍂🥧🧡",
    title: "Happy Thanksgiving!",
    body:  "We're so grateful for you and all the hard work you've put in. Take this break to rest, recharge, and enjoy time with the people who matter most.",
    breakNote: "There are no classes or assignments next week, so take the time to truly rest. We\u2019ll pick back up together right after the break!",
    returnDate: "",            // e.g. "Monday, December 1"
    wallpaper: ["Grateful for", "how far you\u2019ve come."],
    sign:  "With gratitude, the Springboard Team 💙"
  },
  christmas: {
    emoji: "🎄❄️✨",
    title: "Merry Christmas & Happy New Year!",
    body:  "You've worked so hard this year, and you deserve this break. Rest, celebrate, and come back ready to finish strong.",
    breakNote: "There are no classes or assignments over the holiday break, so relax and enjoy every moment. We can\u2019t wait to see you back in the new year!",
    returnDate: "",            // e.g. "Monday, January 5"
    wallpaper: ["Rest now.", "Finish strong."],
    sign:  "Warm wishes, the Springboard Team 💙"
  }
};

/* ---------- theme: from the link, otherwise by month ---------- */
const param = new URLSearchParams(location.search).get("theme");
const month = new Date().getMonth();          // 0 = Jan
const theme = MESSAGES[param] ? param : (month===11 || month===0 ? "christmas" : "thanksgiving");
document.body.classList.add(theme);
const M = MESSAGES[theme];
const $ = id => document.getElementById(id);
$("noteEmoji").textContent = M.emoji;
$("noteTitle").textContent = M.title;
$("noteBody").textContent  = M.body;
$("noteSign").textContent  = M.sign;
{ const t=[M.breakNote, M.returnDate ? `Classes start again ${M.returnDate}.` : ""].filter(Boolean).join(" ");
  $("noteBreakText").textContent=t; $("noteBreak").hidden=!t; }
document.title = M.title + " · Springboard";

/* ---------- falling leaves / snow + confetti burst (one canvas) ---------- */
const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const cv = $("fx"), ctx = cv.getContext("2d");
let W=0, H=0, DPR=Math.min(2, window.devicePixelRatio||1);
function size(){ const r=cv.getBoundingClientRect(); W=r.width; H=r.height; cv.width=W*DPR; cv.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0); }
size(); window.addEventListener("resize", size);

const AMBIENT = theme==="christmas"
  ? { n:70, colors:["#FFFFFF","#FFFFFF","#DEEBFF","#C3F570"], shape:"snow" }
  : { n:26, colors:["#C3F570","#A9E04F","#7E43D0","#DCFBDA"], shape:"leaf" };
const rnd=(a,b)=>a+Math.random()*(b-a);
const ambient = Array.from({length: reduce?0:AMBIENT.n}, ()=>newFlake(true));
function newFlake(anywhere){
  return { x:rnd(0,W||600), y: anywhere ? rnd(-H,H) : rnd(-60,-10), r: AMBIENT.shape==="snow" ? rnd(1.5,4) : rnd(7,13),
           vy: AMBIENT.shape==="snow" ? rnd(.35,1.1) : rnd(.6,1.3), sway:rnd(.4,1.4), ph:rnd(0,6.28), rot:rnd(0,6.28), vr:rnd(-.03,.03),
           c: AMBIENT.colors[Math.floor(Math.random()*AMBIENT.colors.length)], a: rnd(.55,.95) };
}
let bursts=[];
function burst(x,y){
  const cols=["#C3F570","#0455F6","#7E43D0","#DEEBFF","#F0E6FF","#FFFFFF"];
  for(let i=0;i<110;i++){
    const ang=rnd(-Math.PI*.95,-Math.PI*.05), sp=rnd(4,11);
    bursts.push({x,y,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,g:rnd(.16,.26),w:rnd(6,11),h:rnd(9,15),rot:rnd(0,6.28),vr:rnd(-.25,.25),c:cols[i%cols.length],life:0});
  }
}
function drawLeaf(f){
  ctx.save(); ctx.translate(f.x,f.y); ctx.rotate(f.rot); ctx.globalAlpha=f.a; ctx.fillStyle=f.c;
  ctx.beginPath(); ctx.moveTo(0,-f.r); ctx.quadraticCurveTo(f.r*.9,0,0,f.r); ctx.quadraticCurveTo(-f.r*.9,0,0,-f.r); ctx.fill();
  ctx.globalAlpha=f.a*.5; ctx.strokeStyle="#FFFFFF"; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(0,-f.r*.8); ctx.lineTo(0,f.r*.9); ctx.stroke();
  ctx.restore();
}
function tick(){
  ctx.clearRect(0,0,W,H);
  ambient.forEach((f,i)=>{
    f.ph+=.02; f.y+=f.vy; f.x+=Math.sin(f.ph)*f.sway*.6; f.rot+=f.vr;
    if(f.y>H+20) ambient[i]=newFlake(false);
    if(AMBIENT.shape==="snow"){ ctx.globalAlpha=f.a; ctx.fillStyle=f.c; ctx.beginPath(); ctx.arc(f.x,f.y,f.r,0,6.28); ctx.fill(); }
    else drawLeaf(f);
  });
  bursts.forEach(p=>{
    p.life++; p.vy+=p.g; p.vx*=.99; p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr;
    ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot); ctx.globalAlpha=Math.max(0,1-p.life/140); ctx.fillStyle=p.c; ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h); ctx.restore();
  });
  bursts=bursts.filter(p=>p.life<140 && p.y<H+40);
  ctx.globalAlpha=1;
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

/* ---------- the wallpaper (drawn in the browser, so preview = download) ---------- */
function seeded(seed){ return ()=>{ seed=(seed*16807)%2147483647; return (seed-1)/2147483646; }; }
function leafShape(c,x,y,r,rot,col,a){
  c.save(); c.translate(x,y); c.rotate(rot); c.globalAlpha=a; c.fillStyle=col;
  c.beginPath(); c.moveTo(0,-r); c.quadraticCurveTo(r*.9,0,0,r); c.quadraticCurveTo(-r*.9,0,0,-r); c.fill();
  c.globalAlpha=a*.55; c.strokeStyle="#FFFFFF"; c.lineWidth=Math.max(1,r*.08); c.beginPath(); c.moveTo(0,-r*.8); c.lineTo(0,r*.9); c.stroke(); c.restore();
}
function snowflake(c,x,y,r,a){
  c.save(); c.translate(x,y); c.globalAlpha=a; c.strokeStyle="#FFFFFF"; c.lineWidth=Math.max(1.5,r*.12); c.lineCap="round";
  for(let i=0;i<6;i++){ c.rotate(Math.PI/3); c.beginPath(); c.moveTo(0,0); c.lineTo(0,-r); c.moveTo(0,-r*.55); c.lineTo(r*.25,-r*.78); c.moveTo(0,-r*.55); c.lineTo(-r*.25,-r*.78); c.stroke(); }
  c.restore();
}
/* Official logo goes here as a data URL (PNG with transparent background).

  for(let i=1;i<=64;i++){
    const x=w*i/64, t=i/64*seg*Math.PI;
    c.lineTo(x, baseY + Math.sin(t/2+phase)*amp + Math.sin(t*1.3+phase*2)*amp*.35);
  }
  c.lineTo(w,h); c.closePath(); c.fillStyle=color; c.fill();
}
function drawMark(c,x,y,size,ink,center){
  if(logoImg && logoImg.complete && logoImg.naturalWidth){
    const lw=size*12, lh=lw*logoImg.naturalHeight/logoImg.naturalWidth;
    c.drawImage(logoImg, center?x-lw/2:x, y-lh/2, lw, lh); return;
  }
  c.font=`800 ${size}px Manrope, Inter, system-ui, sans-serif`;
  const tw=c.measureText("Springboard").width, dot=size*.42, gap=size*.35, total=dot*2+gap+tw;
  const sx=center?x-total/2:x;
  c.fillStyle="#C3F570"; c.beginPath(); c.arc(sx+dot, y-size*.05, dot, 0, 6.283); c.fill();
  c.fillStyle=ink; c.textBaseline="middle"; c.fillText("Springboard", sx+dot*2+gap, y); c.textBaseline="alphabetic";
}
function drawWallpaper(w,h,kind){
  const cv=document.createElement("canvas"); cv.width=w; cv.height=h; const c=cv.getContext("2d");
  const u=Math.min(w,h)/100, rand=seeded(theme==="christmas"?7:11), xmas=theme==="christmas";
  const phone = kind==="phone";
  const CLR = phone ? {x0:0,x1:w,y0:h*.36,y1:h*.56} : {x0:0,x1:w*.64,y0:h*.24,y1:h*.56};   // keep decor off the words
  const clear=(x,y,pad=0)=>x>CLR.x0-pad && x<CLR.x1+pad && y>CLR.y0-pad && y<CLR.y1+pad;
  // sky
  const g=c.createLinearGradient(0,0,0,h);
  if(xmas){ g.addColorStop(0,"#0B2540"); g.addColorStop(.38,"#1E3FD0"); g.addColorStop(.7,"#0455F6"); g.addColorStop(1,"#5B5BE6"); }
  else    { g.addColorStop(0,"#F0E6FF"); g.addColorStop(.45,"#DEEBFF"); g.addColorStop(.75,"#F4FDEC"); g.addColorStop(1,"#DCFBDA"); }
  c.fillStyle=g; c.fillRect(0,0,w,h);
  const glow=(x,y,r,col)=>{ const rg=c.createRadialGradient(x,y,0,x,y,r); rg.addColorStop(0,col); rg.addColorStop(1,"rgba(255,255,255,0)"); c.fillStyle=rg; c.fillRect(0,0,w,h); };
  if(xmas){
    // aurora ribbons
    c.save(); c.globalCompositeOperation="lighter";
    [["rgba(195,245,112,.22)",.22],["rgba(126,67,208,.30)",.30],["rgba(222,235,255,.14)",.38]].forEach(([col,yy],k)=>{
      c.beginPath(); const y0=h*yy;
      c.moveTo(-w*.1,y0);
      for(let i=0;i<=40;i++){ const x=w*(i/40)*1.2-w*.1; c.lineTo(x, y0 + Math.sin(i/40*Math.PI*2.2+k)*h*.05); }
      for(let i=40;i>=0;i--){ const x=w*(i/40)*1.2-w*.1; c.lineTo(x, y0 + h*.07 + Math.sin(i/40*Math.PI*2.2+k+.6)*h*.05); }
      c.closePath(); c.fillStyle=col; c.filter=`blur(${u*2.5}px)`; c.fill();
    });
    c.restore(); c.filter="none";
    // stars
    for(let i=0;i<(phone?180:260);i++){ const x=rand()*w, y=rand()*h*.62; c.globalAlpha=.25+rand()*.7; c.fillStyle="#FFFFFF"; c.beginPath(); c.arc(x,y,u*(.12+rand()*.35),0,6.283); c.fill(); }
    c.globalAlpha=1;
    glow(w*.82,h*.14,u*(phone?18:14),"rgba(255,255,255,.55)");          // moon glow
    c.fillStyle="#FFFFFF"; c.beginPath(); c.arc(w*.82,h*.14,u*(phone?5.5:4.2),0,6.283); c.fill();
  } else {
    glow(w*.78,h*(phone?.2:.24),u*(phone?40:30),"rgba(195,245,112,.75)"); // soft sun
    c.fillStyle="rgba(255,255,255,.85)"; c.beginPath(); c.arc(w*.78,h*(phone?.2:.24),u*(phone?8:6),0,6.283); c.fill();
  }
  // layered hills (back to front)
  const layers = xmas
    ? [["#3D58E8",.70,4],["#8FB0FF",.77,3],["#DEEBFF",.84,2.5],["#FFFFFF",.91,2]]
    : [["#D9CCF7",.68,3],["#C3F570",.76,2.5],["#A9E04F",.84,2],["#DCFBDA",.92,1.6]];
  layers.forEach(([col,yy,waves],i)=>hills(c,w,h,h*yy,h*(phone?.022:.035)*(1+i*.2),waves,col,rand));
  // little trees on the snowy hills / drifting leaves
  if(xmas){
    for(let i=0;i<(phone?9:16);i++){
      const x=rand()*w, base=h*(.80+rand()*.06), th=u*(phone?7:5)*(.6+rand()*.8);
      c.fillStyle= i%3===0 ? "#7E43D0" : "#0B2540"; c.globalAlpha=.75;
      c.beginPath(); c.moveTo(x,base-th); c.lineTo(x+th*.36,base); c.lineTo(x-th*.36,base); c.closePath(); c.fill();
    }
    c.globalAlpha=1;
    for(let i=0;i<(phone?40:70);i++){ const x=rand()*w,y=rand()*h*.9; if(clear(x,y,u*3)) continue; if(rand()<.25) snowflake(c,x,y,u*(.9+rand()*1.6),.7); else { c.globalAlpha=.55+rand()*.4; c.fillStyle="#FFFFFF"; c.beginPath(); c.arc(x,y,u*(.25+rand()*.45),0,6.283); c.fill(); } }
    c.globalAlpha=1;
  } else {
    const cols=["#7E43D0","#A9E04F","#C3F570","#9A63E0"];
    for(let i=0;i<(phone?18:28);i++){ const x=rand()*w, y=rand()*h*.7; if(clear(x,y,u*3)) continue; leafShape(c,x,y,u*(1.4+rand()*2.2),rand()*6.28,cols[i%cols.length],.6+rand()*.3); }
  }
  // words
  const [l1,l2]=M.wallpaper, ink = xmas ? "#FFFFFF" : "#0B2540", accent = xmas ? "#C3F570" : "#7E43D0";
  const x0 = phone ? w*.09 : w*.08, y0 = phone ? h*.47 : h*.40;
  const maxW = phone ? w-2*x0 : w*.55;
  let big = phone ? w*.105 : h*.085;
  const setBig=()=>{ c.font=`800 ${big}px Manrope, Inter, system-ui, sans-serif`; };
  setBig(); while(Math.max(c.measureText(l1).width, c.measureText(l2).width) > maxW && big>10){ big*=.95; setBig(); }
  c.fillStyle=ink; c.textBaseline="alphabetic";
  if(xmas){ c.shadowColor="rgba(11,37,64,.35)"; c.shadowBlur=u*2; }
  c.fillText(l1,x0,y0); c.fillText(l2,x0,y0+big*1.12); c.shadowBlur=0;
  c.fillStyle=accent; c.fillRect(x0, y0+big*1.12+big*.42, big*1.4, big*.14);
  c.fillStyle=ink; c.globalAlpha=.8; c.font=`700 ${big*.3}px Manrope, Inter, system-ui, sans-serif`;
  c.fillText(M.title.replace(/!$/,""), x0, y0+big*1.12+big*1.05); c.globalAlpha=1;
  // Springboard, small, under the words
  drawMark(c, x0, y0+big*1.12+big*1.75, phone ? w*.022 : h*.016, ink, false);
  return cv;
}
let photoImgs={};
function photoWallpaper(img,kind){
  const cv=document.createElement("canvas"); cv.width=img.naturalWidth; cv.height=img.naturalHeight; const c=cv.getContext("2d");
  c.drawImage(img,0,0);
  if(logoImg){
    const W=cv.width,H=cv.height, lw = kind==="phone" ? W*.30 : W*.13, lh=lw*logoImg.naturalHeight/logoImg.naturalWidth;
    const x = kind==="phone" ? (W-lw)/2 : W-lw-W*.025, y = kind==="phone" ? H-lh-H*.035 : H-lh-H*.045;
    c.save(); c.shadowColor="rgba(0,0,0,.55)"; c.shadowBlur=lh*.6; c.drawImage(logoImg,x,y,lw,lh); c.restore();
  }
  return cv;
}
function makeWallpaper(kind){
  const img=photoImgs[kind];
  if(img) return photoWallpaper(img,kind);
  return kind==="phone" ? drawWallpaper(1170,2532,"phone") : drawWallpaper(2560,1600,"laptop");
}
function download(kind){
  const cv = makeWallpaper(kind);
  const photo=!!photoImgs[kind], name=`springboard-${theme}-${kind}-wallpaper.${photo?"jpg":"png"}`;
  cv.toBlob(blob=>{
    const url=URL.createObjectURL(blob), a=document.createElement("a");
    a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),4000);
  }, photo?"image/jpeg":"image/png", .92);
}
Promise.all([
  document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve(),
  loadImg(LOGO_SRC).then(i=>{ logoImg=i; }),
  ...(PHOTOS[theme] ? ["phone","laptop"].map(k=>loadImg(PHOTOS[theme][k]).then(i=>{ if(i) photoImgs[k]=i; })) : [])
]).then(()=>{
  const prev = photoImgs.phone ? photoWallpaper(photoImgs.phone,"phone") : drawWallpaper(390,845,"phone");
  $("preview").src = prev.toDataURL("image/jpeg",.85);
});
$("dlPhone").addEventListener("click",()=>download("phone"));
$("dlLaptop").addEventListener("click",()=>download("laptop"));

/* ---------- open / reset ---------- */
let opened=false;
function openGift(){
  if(opened) return; opened=true;
  const g=$("gift"); g.classList.add("open");
  const r=g.getBoundingClientRect(), s=$("stage").getBoundingClientRect();
  if(!reduce) setTimeout(()=>burst(r.left-s.left+r.width/2, r.top-s.top+40), 180);
  setTimeout(()=>{ $("giftWrap").classList.add("gone"); $("note").classList.add("show"); $("again").focus({preventScroll:true}); }, reduce?0:650);
}
function reset(){
  opened=false; $("note").classList.remove("show"); $("gift").classList.remove("open");
  setTimeout(()=>{ $("giftWrap").classList.remove("gone"); $("gift").focus({preventScroll:true}); }, reduce?0:250);
}
$("gift").addEventListener("click", openGift);
$("hint").addEventListener("click", openGift);
$("again").addEventListener("click", reset);
</script>
