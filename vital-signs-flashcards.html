<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vital Signs &amp; Body Measurements Flashcards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#0455F6; --blue75:#DEEBFF;
    --purple:#7E43D0; --purple50:#F0E6FF;
    --leaf:#C3F570; --leaf100:#DCFBDA; --leaf50:#F4FDEC;
    --gray:#D7D7DC; --navy:#0B2540; --white:#FFFFFF;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    font-family:"Manrope","Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
    color:var(--navy);
    background:var(--blue75);
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }
  button{font:inherit;cursor:pointer;border:0}
  button:focus-visible,.card:focus-visible{outline:3px solid var(--blue);outline-offset:4px}

  /* ---------- blurred topic world ---------- */
  .world{position:fixed;inset:0;z-index:0;overflow:hidden}
  .layer{position:absolute;inset:-60px;opacity:0;transition:opacity 1.1s ease;filter:blur(16px) saturate(1.1)}
  .layer.on{opacity:1}
  .layer svg{width:100%;height:100%;display:block}
  .drift{animation:drift 14s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
  .drift.slow{animation-duration:20s}
  .drift.rev{animation-direction:alternate-reverse}
  @keyframes drift{from{transform:translate(-18px,10px) rotate(-3deg)}to{transform:translate(22px,-14px) rotate(3deg)}}
  .rise{animation:rise 9s linear infinite;transform-box:fill-box}
  @keyframes rise{from{transform:translateY(120px);opacity:0}20%{opacity:.9}to{transform:translateY(-520px);opacity:0}}
  .needle{animation:swing 6s ease-in-out infinite alternate;transform-origin:600px 420px}
  @keyframes swing{from{transform:rotate(-38deg)}to{transform:rotate(30deg)}}
  .mercury{animation:fill 5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:bottom}
  @keyframes fill{from{transform:scaleY(.35)}to{transform:scaleY(1)}}
  .veil{position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,.55),rgba(222,235,255,.25) 55%,rgba(240,230,255,.35))}

  /* ---------- shell ---------- */
  .app{position:relative;z-index:1;min-height:100%;display:flex;flex-direction:column;padding:14px 20px 12px;max-width:860px;margin:0 auto}
  .top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
  .deck-title{margin:0;font-size:clamp(18px,2.6vw,24px);font-weight:800;letter-spacing:-.01em;line-height:1.15}
  .deck-sub{display:inline-block;margin-top:6px;font-size:13px;font-weight:700;color:var(--navy);background:var(--leaf);padding:3px 10px;border-radius:999px}
  .tools{display:flex;gap:8px;flex-shrink:0}
  .icon-btn{min-width:64px;padding:7px 8px 6px;border-radius:14px;background:rgba(255,255,255,.7);color:var(--blue);display:flex;flex-direction:column;align-items:center;gap:3px;transition:transform .2s,background .2s}
  .icon-btn span{font-size:11px;font-weight:700;line-height:1}
  .icon-btn:hover{background:#fff;transform:translateY(-2px)}
  .icon-btn svg{width:20px;height:20px}

  .progress{margin-top:12px;display:flex;align-items:center;gap:12px}
  .track{flex:1;height:8px;border-radius:99px;background:rgba(255,255,255,.65);overflow:hidden}
  .bar{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--blue),var(--purple));transition:width .5s cubic-bezier(.2,.8,.2,1)}
  .count{font-size:14px;font-weight:700;min-width:64px;text-align:right}
  .dots{display:flex;gap:6px;margin-top:10px}
  .dot{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.75);border:2px solid transparent;transition:all .3s}
  .dot.here{border-color:var(--blue);transform:scale(1.25)}
  .dot.known{background:var(--leaf)}
  .dot.learning{background:var(--purple)}

  /* topic banner */
  .topic{margin:12px 0 6px;height:34px;position:relative}
  .topic span{position:absolute;left:0;top:0;display:inline-flex;align-items:center;gap:10px;font-size:clamp(19px,2.6vw,24px);font-weight:800;color:var(--blue);letter-spacing:-.01em}
  .topic span::before{content:"";width:12px;height:12px;border-radius:4px;background:var(--leaf);box-shadow:0 0 0 4px rgba(195,245,112,.35)}
  .topic span.in{animation:topicIn .7s cubic-bezier(.2,.8,.2,1) both}
  @keyframes topicIn{from{opacity:0;transform:translateX(-24px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}

  /* ---------- the card ---------- */
  .stage{flex:1;display:flex;flex-direction:column;justify-content:center}
  .card{perspective:1600px;outline:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .inner{display:grid;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.3,1.35,.45,1)}
  .card.flipped .inner{transform:rotateY(180deg)}
  .face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:28px;position:relative;overflow:hidden;min-height:260px;display:flex;flex-direction:column;padding:18px 26px 20px}
  .front{
    background:
      linear-gradient(115deg,transparent 0 58%,rgba(255,255,255,.95) 58% 58.4%,rgba(222,235,255,.55) 58.4% 100%),
      linear-gradient(62deg,transparent 0 70%,rgba(255,255,255,.95) 70% 70.4%,rgba(240,230,255,.6) 70.4% 100%),
      linear-gradient(145deg,rgba(255,255,255,.92),rgba(255,255,255,.78));
    box-shadow:0 30px 60px -28px rgba(4,85,246,.45),inset 0 0 0 1px rgba(255,255,255,.9);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  }
  .back{
    transform:rotateY(180deg);color:#fff;
    background:linear-gradient(135deg,#2E6FF8 0%,var(--blue) 45%,#3D3FD9 80%,var(--purple) 125%);
    box-shadow:0 30px 60px -24px rgba(126,67,208,.6);
  }
  .back::after{content:"";position:absolute;inset:0;background:linear-gradient(150deg,rgba(255,255,255,.2),rgba(255,255,255,0) 45%);pointer-events:none}
  .side{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:700;position:relative;z-index:2}
  .side b{padding:4px 12px;border-radius:999px}
  .front .side b{background:var(--blue75);color:var(--blue)}
  .back .side b{background:rgba(255,255,255,.16);color:#fff}
  .hint{opacity:.6;font-weight:600}
  .body{flex:1;display:flex;flex-direction:column;justify-content:center;gap:12px;position:relative;z-index:2;padding:10px 4px 30px}
  .label{align-self:center;background:var(--leaf);color:var(--blue);font-weight:800;font-size:clamp(17px,2.4vw,24px);padding:2px 10px}
  .back .label{color:var(--navy)}
  .line{margin:0;text-align:center;font-weight:700;font-size:clamp(18px,2.6vw,26px);line-height:1.3;text-wrap:balance}
  .line.big{font-size:clamp(32px,5.4vw,52px);font-weight:800;letter-spacing:-.01em}
  .blank{display:inline-block;min-width:3.2em;height:.95em;vertical-align:-.12em;border-bottom:4px solid var(--navy);position:relative;overflow:hidden}
  .blank::after{content:"";position:absolute;left:0;right:0;bottom:-4px;height:4px;background:linear-gradient(90deg,transparent,var(--purple),transparent);animation:scan 2.2s ease-in-out infinite}
  @keyframes scan{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
  .ans{display:inline-block;color:var(--leaf);position:relative}
  .ans::after{content:"";position:absolute;left:-.12em;right:-.12em;bottom:.02em;height:.22em;background:rgba(195,245,112,.3);border-radius:4px;transform-origin:left;transform:scaleX(0)}
  .card.flipped .ans{animation:pop .7s .45s cubic-bezier(.3,1.6,.5,1) both}
  .card.flipped .ans::after{animation:under .5s .8s ease-out both}
  @keyframes pop{0%{opacity:0;transform:translateY(.35em) scale(.6);filter:blur(4px)}100%{opacity:1;transform:none;filter:none}}
  @keyframes under{to{transform:scaleX(1)}}
  .example{align-self:center;margin:4px 0 0;font-size:16px;font-weight:600;background:rgba(255,255,255,.14);padding:8px 16px;border-radius:14px}
  .card.flipped .example{animation:fadeUp .5s 1s both}
  @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  /* bottom-right line motifs on the back */
  .motif{position:absolute;right:16px;bottom:14px;width:96px;height:81px;z-index:1;opacity:.55;pointer-events:none}

  /* entrance when card changes */
  .card.enter-next{animation:enterNext .55s cubic-bezier(.2,.8,.2,1)}
  .card.enter-prev{animation:enterPrev .55s cubic-bezier(.2,.8,.2,1)}
  @keyframes enterNext{from{opacity:0;transform:translateX(60px) rotate(2deg)}to{opacity:1;transform:none}}
  @keyframes enterPrev{from{opacity:0;transform:translateX(-60px) rotate(-2deg)}to{opacity:1;transform:none}}

  /* ---------- controls ---------- */
  .controls{margin-top:14px;display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}
  .nav{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.75);color:var(--blue);display:grid;place-items:center;transition:transform .2s,background .2s}
  .nav:hover:not(:disabled){background:#fff;transform:scale(1.07)}
  .nav:disabled{opacity:.35;cursor:default}
  .nav svg{width:22px;height:22px}
  .flip-btn{height:46px;padding:0 28px;border-radius:999px;font-weight:800;font-size:18px;color:#fff;background:linear-gradient(135deg,#3A78FA,var(--blue) 60%,#3D3FD9);box-shadow:0 12px 24px -12px rgba(4,85,246,.8);transition:transform .2s}
  .flip-btn:hover{transform:translateY(-2px)}
  .rate{display:flex;gap:10px;justify-content:center;margin-top:10px;min-height:46px;opacity:0;transform:translateY(8px);pointer-events:none;transition:all .35s}
  .rate.show{opacity:1;transform:none;pointer-events:auto}
  .rate button{height:46px;padding:0 20px;border-radius:999px;font-weight:700;font-size:17px;transition:transform .2s}
  .rate button:hover{transform:translateY(-2px)}
  .learning-btn{background:var(--purple50);color:var(--purple)}
  .known-btn{background:var(--leaf);color:var(--navy)}
  .keys{text-align:center;margin-top:8px;font-size:12px;opacity:.6}

  /* ---------- intro & finish screens ---------- */
  .screen{position:fixed;inset:0;z-index:5;background:rgba(222,235,255,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;padding:24px;transition:opacity .6s,visibility .6s}
  .screen.hide{opacity:0;visibility:hidden}
  .panel{position:relative;width:min(720px,100%);border-radius:32px;padding:44px 40px 40px;overflow:hidden;
    background:linear-gradient(140deg,rgba(255,255,255,.9),rgba(255,255,255,.7));backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    box-shadow:0 40px 80px -30px rgba(4,85,246,.5)}
  .panel h1{margin:0;font-size:clamp(36px,6.5vw,64px);line-height:1.02;font-weight:800;letter-spacing:-.025em;max-width:11ch}
  .panel h2{margin:0;font-size:clamp(30px,5vw,48px);font-weight:800;letter-spacing:-.02em}
  .squiggle{position:absolute;right:-10px;top:40px;width:min(320px,48%);height:auto}
  .squiggle path{stroke-dasharray:1400;stroke-dashoffset:1400;animation:draw 2.4s .3s cubic-bezier(.6,0,.2,1) forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  .panel .fc{display:block;margin:70px 0 28px auto;width:max-content;font-size:clamp(30px,5vw,50px);font-weight:800;color:var(--blue);opacity:0;animation:fadeUp .7s 1.6s both}
  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
  .start{height:54px;padding:0 30px;border-radius:999px;font-weight:800;font-size:17px;color:#fff;background:linear-gradient(135deg,#3A78FA,var(--blue) 55%,var(--purple));box-shadow:0 14px 28px -12px rgba(4,85,246,.85);transition:transform .2s}
  .start:hover{transform:translateY(-2px) scale(1.02)}
  .ghost{height:54px;padding:0 24px;border-radius:999px;font-weight:700;font-size:16px;background:var(--purple50);color:var(--purple)}
  .meta{font-size:14px;opacity:.7}
  .score{display:flex;align-items:center;gap:28px;margin:26px 0 30px;flex-wrap:wrap}
  .ring{width:150px;height:150px;flex-shrink:0}
  .ring circle{fill:none;stroke-width:14}
  .ring .val{stroke:url(#ringGrad);stroke-linecap:round;transform:rotate(-90deg);transform-origin:center;transition:stroke-dashoffset 1.4s cubic-bezier(.2,.8,.2,1)}
  .ring text{font-size:30px;font-weight:800;fill:var(--navy)}
  .tally{display:grid;gap:10px;font-size:17px;font-weight:700}
  .tally span{display:inline-flex;align-items:center;gap:10px}
  .tally i{width:14px;height:14px;border-radius:5px;display:inline-block}

  .confetti{position:fixed;top:-20px;width:10px;height:16px;border-radius:3px;z-index:6;pointer-events:none;animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

  @media (max-width:560px){
    .face{padding:20px 18px 24px;min-height:300px}
    .panel{padding:32px 24px 28px}
    .hint{display:none}
    .keys{display:none}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  }
</style>
</head>
<body>

<!-- blurred topic backgrounds get injected here -->
<div class="world" id="world"><div class="veil"></div></div>

<main class="app" id="app" aria-live="polite">
  <div class="top">
    <div>
      <h1 class="deck-title" id="deckTitle"></h1>
      <span class="deck-sub" id="deckSub"></span>
    </div>
    <div class="tools">
      <button class="icon-btn" id="shuffleBtn" title="Shuffle" aria-label="Shuffle cards">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>
        <span>Shuffle</span>
      </button>
      <button class="icon-btn" id="restartBtn" title="Start over" aria-label="Start over">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
        <span>Start over</span>
      </button>
    </div>
  </div>

  <div class="progress">
    <div class="track"><div class="bar" id="bar"></div></div>
    <div class="count" id="count"></div>
  </div>
  <div class="dots" id="dots"></div>

  <div class="topic" id="topic"></div>

  <section class="stage">
    <div class="card" id="card" tabindex="0" role="button" aria-label="Flashcard. Press to flip.">
      <div class="inner">
        <div class="face front" id="front"></div>
        <div class="face back" id="back"></div>
      </div>
    </div>

    <div class="controls">
      <button class="nav" id="prevBtn" aria-label="Previous card">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <button class="flip-btn" id="flipBtn">Flip card</button>
      <button class="nav" id="nextBtn" aria-label="Next card">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
      </button>
    </div>
    <div class="rate" id="rate">
      <button class="learning-btn" id="learnBtn">Still learning</button>
      <button class="known-btn" id="knowBtn">Got it</button>
    </div>
    <div class="keys">Space to flip · ← → to move</div>
  </section>
</main>

<!-- intro -->
<div class="screen" id="intro">
  <div class="panel">
    <svg class="squiggle" viewBox="0 0 320 420" fill="none"><path d="M10 40 C 120 10, 240 0, 250 60 C 262 130, 60 150, 40 230 C 20 300, 200 320, 230 270 C 260 220, 120 190, 100 270 C 90 320, 110 360, 130 400" stroke="#0455F6" stroke-width="3" stroke-linecap="round"/></svg>
    <h1 id="introTitle"></h1>
    <span class="fc" id="introSub"></span>
    <div class="row">
      <button class="start" id="startBtn">Start studying</button>
      <span class="meta" id="introMeta"></span>
    </div>
  </div>
</div>

<!-- finish -->
<div class="screen hide" id="finish">
  <div class="panel">
    <h2>Deck complete</h2>
    <div class="score">
      <svg class="ring" viewBox="0 0 150 150">
        <defs><linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#C3F570"/><stop offset="1" stop-color="#0455F6"/></linearGradient></defs>
        <circle cx="75" cy="75" r="60" stroke="#DEEBFF"/>
        <circle class="val" id="ringVal" cx="75" cy="75" r="60" stroke-dasharray="377" stroke-dashoffset="377"/>
        <text x="75" y="86" text-anchor="middle" id="ringText">0%</text>
      </svg>
      <div class="tally">
        <span><i style="background:#C3F570"></i><em id="knownCount" style="font-style:normal"></em></span>
        <span><i style="background:#7E43D0"></i><em id="learnCount" style="font-style:normal"></em></span>
      </div>
    </div>
    <div class="row">
      <button class="start" id="reviewBtn">Review cards I'm still learning</button>
      <button class="ghost" id="againBtn">Study the whole deck</button>
    </div>
  </div>
</div>

<script>
/* =========================================================
   DECK CONTENT — edit here to add cards.
   {blank} marks where the answer goes.
   theme: "scale" | "growth" | "thermo"  (background art)
   ========================================================= */
const DECK = {
  title: "Vital Signs & Body Measurements",
  subtitle: "Flashcards",
  cards: [
    {
      topic: "Height and Weight",
      theme: "scale",
      big: true,
      lines: ["1 kg = {blank} lb (pounds)"],
      answer: "2.2",
      example: "Example: 10 kg = 22 lb"
    },
    {
      topic: "Height and Weight",
      theme: "growth",
      label: "Pediatric measurements",
      lines: [
        "Height, weight, and head circumference are completed during a <em>routine physical exam.</em>",
        "{blank} is usually the only anthropometric measurement taken <em>during sick visits.</em>"
      ],
      answer: "Weight"
    },
    {
      topic: "Temperature",
      theme: "thermo",
      lines: ["Temperature is measured orally (by mouth) via a {blank} thermometer."],
      answer: "digital"
    },
    {
      /* TEST CARD — delete this whole block after the update test */
      topic: "Test card",
      theme: "growth",
      lines: ["This card was added to test that updates show up in Canvas. Update {blank}!"],
      answer: "received"
    },
    {
      /* TEST CARD 2 — delete this whole block after the update test */
      topic: "Test card",
      theme: "thermo",
      lines: ["This is the second test card. If you can see it, the deck updated {blank}!"],
      answer: "automatically"
    }
  ]
};

/* ---------- blurred background art (SVG, brand colors only) ---------- */
const THEMES = {
  scale: `
    <svg viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
      <circle class="drift slow" cx="980" cy="160" r="230" fill="#C3F570" opacity=".55"/>
      <circle class="drift rev" cx="170" cy="650" r="260" fill="#7E43D0" opacity=".35"/>
      <g opacity=".75">
        <circle cx="600" cy="420" r="250" fill="#0455F6" opacity=".35"/>
        <circle cx="600" cy="420" r="190" fill="none" stroke="#FFFFFF" stroke-width="22" opacity=".8"/>
        <g class="needle"><rect x="590" y="220" width="20" height="210" rx="10" fill="#0455F6"/></g>
        <circle cx="600" cy="420" r="30" fill="#7E43D0"/>
      </g>
      <g class="drift" opacity=".7">
        <rect x="60" y="90" width="460" height="90" rx="20" fill="#F0E6FF"/>
        <g fill="#7E43D0">${Array.from({length:12},(_,i)=>`<rect x="${90+i*36}" y="90" width="8" height="${i%3===0?60:34}" rx="4"/>`).join("")}</g>
      </g>
    </svg>`,
  growth: `
    <svg viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
      <circle class="drift" cx="1020" cy="620" r="260" fill="#7E43D0" opacity=".38"/>
      <circle class="drift rev slow" cx="200" cy="150" r="220" fill="#C3F570" opacity=".5"/>
      <g fill="none" stroke-linecap="round" class="drift slow">
        <path d="M60 720 C 300 680, 500 520, 700 380 S 1050 140, 1180 110" stroke="#0455F6" stroke-width="34" opacity=".55"/>
        <path d="M60 760 C 320 740, 540 600, 740 470 S 1060 260, 1180 230" stroke="#7E43D0" stroke-width="26" opacity=".5"/>
        <path d="M60 640 C 280 600, 470 430, 660 300 S 1020 60, 1180 20" stroke="#C3F570" stroke-width="22" opacity=".7"/>
      </g>
      <g fill="#FFFFFF" opacity=".9">
        <circle cx="420" cy="590" r="22"/><circle cx="700" cy="380" r="22"/><circle cx="960" cy="210" r="22"/>
      </g>
      <g class="drift rev" opacity=".7">
        <rect x="80" y="260" width="80" height="420" rx="18" fill="#DEEBFF"/>
        <g fill="#0455F6">${Array.from({length:10},(_,i)=>`<rect x="80" y="${290+i*38}" width="${i%2?28:46}" height="7" rx="3"/>`).join("")}</g>
      </g>
    </svg>`,
  thermo: `
    <svg viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
      <circle class="drift" cx="1000" cy="180" r="250" fill="#7E43D0" opacity=".42"/>
      <circle class="drift rev slow" cx="220" cy="660" r="240" fill="#C3F570" opacity=".5"/>
      <g class="drift slow">
        <rect x="560" y="90" width="110" height="520" rx="55" fill="#FFFFFF" opacity=".85"/>
        <circle cx="615" cy="650" r="105" fill="#FFFFFF" opacity=".85"/>
        <rect class="mercury" x="590" y="170" width="50" height="460" rx="25" fill="#7E43D0"/>
        <circle cx="615" cy="650" r="74" fill="#7E43D0"/>
      </g>
      <g fill="none" stroke="#0455F6" stroke-width="16" stroke-linecap="round" opacity=".55">
        <path class="drift" d="M200 300 q 40 -40 80 0 t 80 0 t 80 0"/>
        <path class="drift rev" d="M800 470 q 40 -40 80 0 t 80 0 t 80 0"/>
      </g>
      <g fill="#0455F6" opacity=".6">
        <circle class="rise" cx="420" cy="700" r="26" style="animation-delay:0s"/>
        <circle class="rise" cx="820" cy="760" r="18" style="animation-delay:3s"/>
        <circle class="rise" cx="330" cy="760" r="14" style="animation-delay:6s"/>
        <circle class="rise" cx="900" cy="720" r="24" style="animation-delay:4.5s"/>
      </g>
    </svg>`
};

/* fine-line white motifs for the card backs (rotate as a set) */
const MOTIFS = [
  `<svg class="motif" viewBox="0 0 130 110" fill="none" stroke="#fff" stroke-width="1.2">${[0,1,2,3,4,5].map(i=>`<line x1="${10+i*22}" y1="0" x2="${10+i*22}" y2="110"/><line x1="0" y1="${10+i*20}" x2="130" y2="${10+i*20}"/>`).join("")}<rect x="54" y="50" width="22" height="20" fill="#fff" stroke="none"/><rect x="98" y="90" width="22" height="20" fill="#C3F570" stroke="none"/></svg>`,
  `<svg class="motif" viewBox="0 0 130 110" fill="none" stroke="#fff" stroke-width="1.2"><line x1="0" y1="104" x2="130" y2="104"/>${[0,1,2,3,4].map(i=>`<rect x="${10+i*24}" y="${84-i*18}" width="14" height="${20+i*18}"/>`).join("")}<rect x="106" y="12" width="14" height="92" fill="#C3F570" stroke="none" opacity=".9"/></svg>`,
  `<svg class="motif" viewBox="0 0 130 110" fill="none" stroke="#fff" stroke-width="1.2">${[14,30,46,62,78].map((r,i)=>`<circle cx="110" cy="92" r="${r}" opacity="${1-i*.18}"/>`).join("")}<circle cx="110" cy="92" r="6" fill="#C3F570" stroke="none"/></svg>`
];

/* ---------- state ---------- */
let order = [], pos = 0, status = {}, currentTheme = null;
const $ = id => document.getElementById(id);
const card = $("card");

/* build bg layers once */
Object.entries(THEMES).forEach(([k,svg])=>{
  const d=document.createElement("div"); d.className="layer"; d.dataset.theme=k; d.innerHTML=svg;
  $("world").insertBefore(d,$("world").querySelector(".veil"));
});

function setTheme(t){
  if(t===currentTheme) return;
  currentTheme=t;
  document.querySelectorAll(".layer").forEach(l=>l.classList.toggle("on",l.dataset.theme===t));
}

function fill(lines, mode, answer){
  return lines.map(l=>{
    const html = l.replace("{blank}", mode==="front"
      ? `<span class="blank" aria-label="blank"></span>`
      : `<span class="ans">${answer}</span>`);
    return html;
  });
}

function faceHTML(c, mode, idx){
  const lines = fill(c.lines, mode, c.answer)
    .map(h=>`<p class="line${c.big?" big":""}">${h}</p>`).join("");
  return `
    <div class="side"><b>${mode==="front"?"Front":"Back"}</b><span class="hint">${mode==="front"?"Click to reveal":"Click to flip back"}</span></div>
    <div class="body">
      ${c.label?`<span class="label">${c.label}</span>`:""}
      ${lines}
      ${mode==="back"&&c.example?`<p class="example">${c.example}</p>`:""}
    </div>
    ${mode==="back"?MOTIFS[idx%MOTIFS.length]:""}`;
}

function render(dir){
  const ci = order[pos], c = DECK.cards[ci];
  card.classList.remove("flipped");
  $("rate").classList.remove("show");
  $("front").innerHTML = faceHTML(c,"front",ci);
  $("back").innerHTML  = faceHTML(c,"back",ci);
  setTheme(c.theme);

  const prevTopic = $("topic").dataset.t;
  if(prevTopic!==c.topic){
    $("topic").dataset.t=c.topic;
    $("topic").innerHTML=`<span class="in">${c.topic}</span>`;
  }

  if(dir){ card.classList.remove("enter-next","enter-prev"); void card.offsetWidth; card.classList.add(dir==="next"?"enter-next":"enter-prev"); }

  $("count").textContent = `${pos+1} of ${order.length}`;
  $("bar").style.width = `${((pos+1)/order.length)*100}%`;
  $("prevBtn").disabled = pos===0;
  $("dots").innerHTML = order.map((k,i)=>`<span class="dot ${i===pos?"here":""} ${status[k]||""}"></span>`).join("");
  $("flipBtn").textContent = "Flip card";
}

function flip(){
  card.classList.toggle("flipped");
  const on = card.classList.contains("flipped");
  $("rate").classList.toggle("show", on);
  $("flipBtn").textContent = on ? "Show front" : "Flip card";
}
function next(){ if(pos<order.length-1){pos++;render("next");} else finish(); }
function prev(){ if(pos>0){pos--;render("prev");} }
function rate(s){ status[order[pos]]=s; setTimeout(next,250); }

function start(list){
  order = list; pos = 0;
  $("intro").classList.add("hide"); $("finish").classList.add("hide");
  $("topic").dataset.t="";
  render("next"); card.focus({preventScroll:true});
}
const all = () => DECK.cards.map((_,i)=>i);
function shuffle(){
  const a=[...order]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  order=a; pos=0; $("topic").dataset.t=""; render("next");
}

function finish(){
  const known = order.filter(k=>status[k]==="known").length;
  const learning = order.filter(k=>status[k]==="learning");
  const pct = Math.round(known/order.length*100);
  $("knownCount").textContent = `Got it: ${known}`;
  $("learnCount").textContent = `Still learning: ${learning.length}`;
  $("reviewBtn").style.display = learning.length ? "" : "none";
  $("reviewBtn").onclick = ()=>start(learning);
  $("finish").classList.remove("hide");
  $("ringVal").style.strokeDashoffset = 377;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{ $("ringVal").style.strokeDashoffset = 377*(1-pct/100); }));
  let n=0; const t=setInterval(()=>{ n=Math.min(pct,n+2); $("ringText").textContent=n+"%"; if(n>=pct)clearInterval(t); },20);
  if(pct>=50) confetti();
}

function confetti(){
  const cols=["#C3F570","#0455F6","#7E43D0","#DEEBFF","#F0E6FF"];
  for(let i=0;i<70;i++){
    const p=document.createElement("i"); p.className="confetti";
    p.style.left=Math.random()*100+"vw"; p.style.background=cols[i%cols.length];
    p.style.animationDuration=(2.2+Math.random()*2)+"s"; p.style.animationDelay=(Math.random()*.6)+"s";
    p.style.transform=`rotate(${Math.random()*360}deg)`;
    document.body.appendChild(p); setTimeout(()=>p.remove(),5000);
  }
}

/* ---------- wiring ---------- */
$("deckTitle").textContent = DECK.title;
$("deckSub").textContent = DECK.subtitle;
$("introTitle").textContent = DECK.title;
$("introSub").textContent = DECK.subtitle;
$("introMeta").textContent = `${DECK.cards.length} cards`;
setTheme(DECK.cards[0].theme);

$("startBtn").onclick = ()=>start(all());
$("againBtn").onclick = ()=>{ status={}; start(all()); };
$("restartBtn").onclick = ()=>{ status={}; start(all()); };
$("shuffleBtn").onclick = shuffle;
$("flipBtn").onclick = flip;
$("nextBtn").onclick = next;
$("prevBtn").onclick = prev;
$("knowBtn").onclick = ()=>rate("known");
$("learnBtn").onclick = ()=>rate("learning");
card.onclick = flip;

document.addEventListener("keydown",e=>{
  if(!$("intro").classList.contains("hide")||!$("finish").classList.contains("hide")) return;
  if(e.key===" "||e.key==="Enter"){ if(e.target.tagName==="BUTTON"&&e.target!==card) return; e.preventDefault(); flip(); }
  if(e.key==="ArrowRight") next();
  if(e.key==="ArrowLeft") prev();
});

/* swipe on phones/tablets */
let sx=null;
card.addEventListener("touchstart",e=>{sx=e.touches[0].clientX},{passive:true});
card.addEventListener("touchend",e=>{
  if(sx===null) return; const dx=e.changedTouches[0].clientX-sx; sx=null;
  if(Math.abs(dx)>50){ e.preventDefault(); dx<0?next():prev(); }
});
</script>
</body>
</html>
